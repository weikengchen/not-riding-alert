name: Build

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  build-macos-native:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build macOS WebView helper
        run: |
          cd native/macos
          bash build.sh

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: native/macos/webview-helper
          retention-days: 1

  build-windows-native:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows WebView helper
        run: |
          cd native/windows
          dotnet publish -c Release -r win-x64 --no-self-contained -p:PublishSingleFile=true -o publish

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: |
            native/windows/publish/webview-helper.exe
            native/windows/publish/runtimes/win-x64/native/WebView2Loader.dll
          retention-days: 1

  build:
    needs: [build-macos-native, build-windows-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: native-macos
          path: native-macos

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: native-windows
          path: native-windows

      - name: Assemble native resources
        run: |
          mkdir -p src/main/resources/native/macos
          mkdir -p src/main/resources/native/windows

          # Source files for reviewability
          cp native/macos/WebViewHelper.swift src/main/resources/native/macos/
          cp native/windows/WebViewHelper.cs src/main/resources/native/windows/
          cp native/windows/WebViewHelper.csproj src/main/resources/native/windows/

          # Compiled binaries
          cp native-macos/webview-helper src/main/resources/native/macos/
          chmod +x src/main/resources/native/macos/webview-helper
          cp native-windows/native/windows/publish/webview-helper.exe src/main/resources/native/windows/
          cp native-windows/native/windows/publish/runtimes/win-x64/native/WebView2Loader.dll src/main/resources/native/windows/

          echo "=== Native resources ==="
          ls -lhR src/main/resources/native/

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Verify native binaries in JAR
        run: |
          jar tf build/libs/*.jar | grep native

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JAR files
          path: build/libs/*.jar
          retention-days: 7

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build/libs/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
