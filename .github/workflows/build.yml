name: Build

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  build-macos-native:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build macOS WebView helper
        run: |
          cd native/macos
          bash build.sh

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: native/macos/webview-helper
          retention-days: 1

  build-windows-native:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows WebView helper
        run: |
          cd native/windows
          dotnet publish -c Release -r win-x64 --no-self-contained -p:PublishSingleFile=true -o publish

      - name: Collect Windows binaries
        run: |
          mkdir -p native-out
          cp native/windows/publish/webview-helper.exe native-out/
          cp native/windows/publish/runtimes/win-x64/native/WebView2Loader.dll native-out/

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: native-out/
          retention-days: 1

  build:
    needs: [build-macos-native, build-windows-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '26.1'
            java: '25'
            distribution: 'microsoft'
          - version: '1.21.11'
            java: '21'
            distribution: 'microsoft'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: native-macos
          path: native-macos

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: native-windows
          path: native-windows

      - name: Assemble native resources
        run: |
          MOD_DIR="mods/${{ matrix.version }}"
          mkdir -p "$MOD_DIR/src/main/resources/native/macos"
          mkdir -p "$MOD_DIR/src/main/resources/native/windows"

          # Source files for reviewability
          cp native/macos/WebViewHelper.swift "$MOD_DIR/src/main/resources/native/macos/"
          cp native/windows/WebViewHelper.cs "$MOD_DIR/src/main/resources/native/windows/"
          cp native/windows/WebViewHelper.csproj "$MOD_DIR/src/main/resources/native/windows/"

          # Compiled binaries
          cp native-macos/webview-helper "$MOD_DIR/src/main/resources/native/macos/"
          chmod +x "$MOD_DIR/src/main/resources/native/macos/webview-helper"
          cp native-windows/webview-helper.exe "$MOD_DIR/src/main/resources/native/windows/"
          cp native-windows/WebView2Loader.dll "$MOD_DIR/src/main/resources/native/windows/"

          echo "=== Native resources ==="
          ls -lhR "$MOD_DIR/src/main/resources/native/"
          echo "=== Verifying key files exist ==="
          test -f "$MOD_DIR/src/main/resources/native/macos/webview-helper"
          test -f "$MOD_DIR/src/main/resources/native/windows/webview-helper.exe"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.distribution }}

      - name: Make gradlew executable
        run: chmod +x mods/${{ matrix.version }}/gradlew

      - name: Build with Gradle
        working-directory: mods/${{ matrix.version }}
        run: ./gradlew build

      - name: Verify native binaries in JAR
        working-directory: mods/${{ matrix.version }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          echo "Checking $JAR"
          jar tf "$JAR" | grep native

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JAR files - ${{ matrix.version }}
          path: mods/${{ matrix.version }}/build/libs/*.jar
          retention-days: 7

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: mods/${{ matrix.version }}/build/libs/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
