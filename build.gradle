plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.diffplug.spotless' version '8.2.1'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://jitpack.io" }
	maven { url = "https://maven.terraformersmc.com/releases" }
	maven { url = "https://cursemaven.com" }
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// No mappings needed — MC 26.1 is unobfuscated
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Mixin for language server visibility
	compileOnly "org.spongepowered:mixin:0.8.5"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Cloth Config API for config screen (required dependency)
	// TODO: Update version when cloth-config releases a 26.1 build
	api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"){
		exclude(group: "net.fabricmc.fabric-api")
	}

	// ModMenu for config screen support
	compileOnly "com.terraformersmc:modmenu:18.0.0-alpha.7"
	compileOnly("com.github.weikengchen:monkeycraft-api:2026-02-27") {
		transitive = false
	}

	// Emoji detection library
	implementation "com.vdurmont:emoji-java:5.1.1"
	include "com.vdurmont:emoji-java:5.1.1"
	implementation "org.json:json:20231013"
	include "org.json:json:20231013"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

spotless {
	java {
		googleJavaFormat()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}
